name: Flock • check development game

on:
  push:
    branches: [dev/flock-game]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Flock
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and run world tests
        run: |
          node --check flock/dev/src/main.js
          node --check flock/dev/src/render.js
          node --check flock/dev/src/world.js
          node --check flock/dev/src/helpers.js
          node --check flock/dev/src/audio.js
          cd flock/dev && npm test
      - name: Package standalone site at /flock/dev/
        run: |
          mkdir -p _site/flock/dev
          cp index.html _site/index.html
          cp -R flock/dev/. _site/flock/dev/
          rm -f _site/flock/dev/package.json _site/flock/dev/src/*.test.mjs
          touch _site/.nojekyll
          test -f _site/flock/dev/src/helpers.js
          test -f _site/flock/dev/index.html
# GitHub Pages is published by its native gh-pages branch build, not this check.
