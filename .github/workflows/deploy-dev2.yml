name: Flock 3D — checks and standalone build

on:
  push:
    branches: [flock_3D_chatgpt-work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flock-dev2-checks
  cancel-in-progress: true

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test simulation, controls and scene construction
        run: npm test
      - name: Build standalone game
        run: npm run build
      - name: Upload standalone game
        uses: actions/upload-artifact@v4
        with:
          name: flock-dev2-standalone
          path: dist/
          if-no-files-found: error
