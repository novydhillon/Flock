name: Flock 3D — checks and standalone build

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flock-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Checked build
        env:
          TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
        run: node scripts/build-checked.mjs "$TARGET"
      - name: Upload standalone game
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/main' && 'flock-production-standalone' || 'flock-dev-standalone' }}
          path: dist/
          if-no-files-found: error
